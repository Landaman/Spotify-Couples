name: Lint
on:
  workflow_call:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read # This is required for actions/checkout

jobs:
  lint:
    name: 'Lint App'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/setup'
      - name: Pull Supabase images from GHCR
        run: |
          bun supabase services -o json | jq -r '
            .[] | select(.name == "supabase/postgres" or .name == "supabase/postgres-meta")
            | "public.ecr.aws/\(.name):\(.local)"
          ' > "$RUNNER_TEMP/supabase-images.txt"
          while IFS= read -r image; do
            mirror="ghcr.io/${image#public.ecr.aws/}"
            docker pull "$mirror"
            # Supabase expects the ECR name even when the image comes from GHCR.
            docker image tag "$mirror" "$image"
          done < "$RUNNER_TEMP/supabase-images.txt"
      - name: Generate local JWT signing key
        run: |
          printf '[]\n' > supabase/signing_keys.json
          bun supabase gen signing-key --algorithm ES256 --append
      - name: Start Supabase database
        run: bun supabase db start
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.turbo
          # Generate a new hash for every commit
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          # But restore the cache as long as we're on the same OS
          restore-keys: |
            ${{ runner.os }}-turbo-lint

      - name: Run Typechecks
        run: bun turbo check --cache-dir=.turbo
        env:
          # Otherwise, client code gen for Svelte will fail
          PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
          PUBLIC_POSTHOG_KEY: 'phc_ci_placeholder'
          PUBLIC_POSTHOG_HOST: 'https://posthog.invalid'
          SPOTIFY_CLIENT_ID: ''
          SPOTIFY_CLIENT_SECRET: ''
      - name: Run Linting
        run: bun turbo lint --cache-dir=.turbo
        env:
          # Otherwise, client code gen for Svelte will fail
          PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
          PUBLIC_POSTHOG_KEY: 'phc_ci_placeholder'
          PUBLIC_POSTHOG_HOST: 'https://posthog.invalid'
          SPOTIFY_CLIENT_ID: ''
          SPOTIFY_CLIENT_SECRET: ''
