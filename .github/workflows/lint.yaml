name: Lint
on:
  workflow_call:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read # This is required for actions/checkout

jobs:
  lint:
    name: 'Lint App'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/setup'
      - name: Identify Supabase images
        id: supabase-images
        run: |
          bun supabase services -o json | jq -r '
            .[] | select(.name == "supabase/postgres" or .name == "supabase/postgres-meta")
            | "public.ecr.aws/\(.name):\(.local)"
          ' > "$RUNNER_TEMP/supabase-images.txt"
          echo "hash=$(sha256sum "$RUNNER_TEMP/supabase-images.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Supabase images
        id: supabase-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/supabase-images.tar
          key: ${{ runner.os }}-${{ runner.arch }}-supabase-images-v1-${{ steps.supabase-images.outputs.hash }}
      - name: Load Supabase images
        if: steps.supabase-cache.outputs.cache-hit == 'true'
        run: docker image load --input "$RUNNER_TEMP/supabase-images.tar"
      - name: Download Supabase images
        if: steps.supabase-cache.outputs.cache-hit != 'true'
        run: |
          mapfile -t images < "$RUNNER_TEMP/supabase-images.txt"
          for image in "${images[@]}"; do
            if ! docker pull "$image"; then
              mirror="ghcr.io/${image#public.ecr.aws/}"
              echo "ECR pull failed; trying $mirror"
              docker pull "$mirror"
              # Supabase expects the ECR name even when the image comes from GHCR.
              docker image tag "$mirror" "$image"
            fi
          done
          docker image save --output "$RUNNER_TEMP/supabase-images.tar" "${images[@]}"
      # Save before database startup and app checks so their failures do not discard the images.
      - name: Save Supabase images
        if: steps.supabase-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/supabase-images.tar
          key: ${{ steps.supabase-cache.outputs.cache-primary-key }}
      - name: Start Supabase database
        run: bun supabase db start
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.turbo
          # Generate a new hash for every commit
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          # But restore the cache as long as we're on the same OS
          restore-keys: |
            ${{ runner.os }}-turbo-lint

      - name: Run Typechecks
        run: bun turbo check --cache-dir=.turbo
        env:
          # Otherwise, client code gen for Svelte will fail
          PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          PUBLIC_SUPABASE_ANON_KEY: ''
          SPOTIFY_CLIENT_ID: ''
          SPOTIFY_CLIENT_SECRET: ''
      - name: Run Linting
        run: bun turbo lint --cache-dir=.turbo
        env:
          # Otherwise, client code gen for Svelte will fail
          PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          PUBLIC_SUPABASE_ANON_KEY: ''
          SPOTIFY_CLIENT_ID: ''
          SPOTIFY_CLIENT_SECRET: ''
